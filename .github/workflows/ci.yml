# Aegis CI — test, vet, build on push and PR
name: CI

on:
  push:
    # Feature branches run here too, so a branch gets validated on Linux before it
    # reaches a PR or a real host. Local runs are typically on Windows.
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so the two cannot drift apart again — the pin said 1.22
          # while go.mod required 1.25.0, and every run failed at the first Go step.
          go-version-file: 'go.mod'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: |
          cd ui && npm ci

      - name: Test UI state contracts
        run: |
          cd ui && npm test

      - name: Build UI
        run: |
          cd ui && npm run build

      - name: Embed UI
        run: |
          rm -rf internal/uiassets/dist
          cp -r ui/dist internal/uiassets/dist

      - name: Go vet
        run: go vet ./...

      - name: Go build (all)
        run: go build ./cmd/aegis ./internal/... ./pkg/...

      - name: Go test (all)
        run: go test ./... -count=1 -timeout=120s

      - name: Go race tests (lifecycle critical packages)
        run: go test -race ./internal/certstore ./internal/tlslifecycle ./internal/topology ./internal/apply ./internal/httpapi ./internal/httpapi/handlers -count=1 -timeout=180s
